<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>All Incidents | INC Chatbot</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fas fa-robot"></i></div>
            <div class="brand-text">
                <span class="brand-name">INC Chatbot</span>
                <span class="brand-sub">Knowledge Base</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">MAIN</div>
            <a th:href="@{/chat}" class="nav-item"><i class="fas fa-comments"></i><span>Chat</span></a>
            <a th:href="@{/search}" class="nav-item"><i class="fas fa-search"></i><span>Search</span></a>
            <a th:href="@{/incidents}" class="nav-item active"><i class="fas fa-list-alt"></i><span>All Incidents</span></a>
            <div class="nav-section-label" sec:authorize="hasAnyRole('CONTRIBUTOR','APPROVER','ADMIN')">ACTIONS</div>
            <a th:href="@{/incidents/new}" class="nav-item" sec:authorize="hasAnyRole('CONTRIBUTOR','APPROVER','ADMIN')">
                <i class="fas fa-plus-circle"></i><span>New Incident</span>
            </a>
            <div class="nav-section-label" sec:authorize="hasRole('ADMIN')">ADMIN</div>
            <a th:href="@{/admin}" class="nav-item" sec:authorize="hasRole('ADMIN')">
                <i class="fas fa-cog"></i><span>Admin Panel</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
                <div class="user-details">
                    <span class="user-name" sec:authentication="name">User</span>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-list-alt"></i> All Incidents</h1>
            <div style="display:flex; gap:10px; align-items:center">
                <span class="stat-pill">
                    <i class="fas fa-database"></i> <span th:text="${totalElements}">0</span> total
                </span>
                <a th:href="@{/incidents/new}" class="btn btn-primary"
                   sec:authorize="hasAnyRole('CONTRIBUTOR','APPROVER','ADMIN')">
                    <i class="fas fa-plus"></i> New
                </a>
            </div>
        </div>

        <!-- Quick search -->
        <div class="search-form-card" style="padding:12px 20px">
            <form th:action="@{/search}" method="get" class="search-form">
                <div class="search-input-group">
                    <input type="text" name="q" placeholder="Quick search..." class="search-text-input"/>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </form>
        </div>

        <div class="results-table-wrapper">
            <table class="results-table">
                <thead>
                <tr>
                    <th>INCIDENT NO</th>
                    <th>TASK</th>
                    <th>APP</th>
                    <th>DESCRIPTION</th>
                    <th>STATUS</th>
                    <th>APPROVED</th>
                    <th>CREATED</th>
                    <th>ACTION</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="inc : ${incidents}" class="result-row">
                    <td>
                        <a th:href="@{/incidents/{id}(id=${inc.id})}" class="inc-link"
                           th:text="${inc.incidentNo}">INC</a>
                    </td>
                    <td th:text="${inc.taskNo != null ? inc.taskNo : '-'}">-</td>
                    <td>
                        <span class="app-badge" th:if="${inc.app}" th:text="${inc.app}">APP</span>
                        <span th:unless="${inc.app}">-</span>
                    </td>
                    <td>
                        <div class="desc-cell" th:text="${inc.description != null ? #strings.abbreviate(inc.description, 80) : '-'}">-</div>
                    </td>
                    <td>
                        <span class="status-badge"
                              th:classappend="'status-' + ${inc.status != null ? inc.status.name().toLowerCase() : 'draft'}"
                              th:text="${inc.status != null ? inc.status.name() : 'DRAFT'}">-</span>
                    </td>
                    <td>
                        <i class="fas fa-check-circle" style="color:#4CAF50" th:if="${inc.isApproved}"></i>
                        <i class="fas fa-clock" style="color:#FF9800" th:unless="${inc.isApproved}"></i>
                    </td>
                    <td th:text="${#temporals.format(inc.createdAt, 'dd MMM yy')}">-</td>
                    <td>
                        <a th:href="@{/incidents/{id}(id=${inc.id})}" class="btn btn-sm btn-primary">
                            <i class="fas fa-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${incidents.isEmpty()}">
                    <td colspan="8" style="text-align:center; padding:40px; color:#999">
                        <i class="fas fa-inbox fa-2x"></i><br/>No incidents found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:href="@{/incidents(page=${currentPage - 1})}"
               th:if="${currentPage > 0}" class="page-btn">
                <i class="fas fa-chevron-left"></i>
            </a>
            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a th:href="@{/incidents(page=${i})}"
                   class="page-btn"
                   th:classappend="${i == currentPage ? 'active' : ''}"
                   th:text="${i + 1}">1</a>
            </span>
            <a th:href="@{/incidents(page=${currentPage + 1})}"
               th:if="${currentPage < totalPages - 1}" class="page-btn">
                <i class="fas fa-chevron-right"></i>
            </a>
        </div>
    </main>
</div>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
